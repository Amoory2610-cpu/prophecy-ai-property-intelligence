# Render Blueprint (https://render.com/docs/blueprint-spec).
# Prepared for deployment but not yet verified on a live Render account - see README "Deployment".
databases:
  - name: prophecy-db
    plan: free
    databaseName: prophecy
    user: prophecy

services:
  - type: web
    name: prophecy-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prophecy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false # set to the frontend URL, e.g. https://prophecy-web.onrender.com
      - key: AI_PROVIDER
        value: none # set to "anthropic" and add ANTHROPIC_API_KEY to enable model explanations
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: prophecy-web
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      # Used at build time (Next.js rewrites) and runtime. Render passes env vars to Docker builds.
      - key: API_ORIGIN
        sync: false # set to the API URL, e.g. https://prophecy-api.onrender.com
