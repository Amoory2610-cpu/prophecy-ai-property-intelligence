# Local development stack: PostgreSQL, FastAPI backend and Next.js frontend.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prophecy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prophecy}
      POSTGRES_DB: ${POSTGRES_DB:-prophecy}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prophecy} -d ${POSTGRES_DB:-prophecy}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prophecy}:${POSTGRES_PASSWORD:-prophecy}@db:5432/${POSTGRES_DB:-prophecy}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me-0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      IMPORT_SAMPLE_DATA: ${IMPORT_SAMPLE_DATA:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8000
    environment:
      API_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
