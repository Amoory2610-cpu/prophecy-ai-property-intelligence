[project]
name = "prophecy-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "S105", "S106", "B904", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"alembic/*" = ["I"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
